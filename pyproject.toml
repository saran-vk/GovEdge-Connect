[project]
name = "govconnect-edge"
version = "0.1.0"
description = "GovConnect Edge: A Dialect-Adaptive, Voice-to-Voice Gateway for Inclusive e-Governance"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Saran V", email = "saran.vkumar2006+github@gmail.com" },
    { name = "Sanjay Rathinam M. N." }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "chromadb>=0.4.24",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "jiwer>=3.0.0",
]

[project.optional-dependencies]
ai = [
    "torch>=2.2.0",
    "faster-whisper>=1.0.0",
    "transformers>=4.38.0",
    "onnxruntime>=1.17.0",
    "jiwer>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "services", "middleware", "eval"]
