[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "govconnect"
version = "0.1.0"
description = "Multilingual Speech-to-Welfare Assistant for e-Governance"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.0,<2.0",
    "sentence-transformers>=3.0,<6.0",
    "pdfplumber>=0.11,<0.13",
    "langchain-core>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "pypdf>=6.0",
    "PyYAML>=6.0,<7.0",
    "faster-whisper>=1.1,<2.0",
    "jiwer>=3.0,<4.0",
    "edge-tts>=7.0,<8.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "jsonschema>=4.20,<5.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["track_a*", "track_b*", "shared*", "demo*", "scripts*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["track_a/tests", "track_b/tests"]
